name: Xcode

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.github/workflows/build.yml'
      - '.github/actions/determine-build-settings/**'
      - '.github/actions/xcodebuild/**'
      - '.github/actions/run-tests/**'
      - '.github/actions/upload-coverage/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONE_DEVICE: &iphone-device "iPhone 17"
  IPAD_DEVICE: &ipad-device "iPad Pro 13-inch (M5)"
  COVERAGE_DEVICE: *iphone-device

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create Local.xcconfig for CI
        run: cp Local.xcconfig.example Local.xcconfig

      - name: Determine Build Settings
        id: settings
        uses: ./.github/actions/determine-build-settings

      - name: Build Main Target
        uses: ./.github/actions/xcodebuild
        with:
          actions: clean build analyze
          scheme: ${{ steps.settings.outputs.scheme }}
          filetype-parameter: ${{ steps.settings.outputs.filetype_parameter }}
          file-to-build: ${{ steps.settings.outputs.file_to_build }}
          raw-log-path: xcodebuild-main-raw.log

      - name: Upload Raw Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcodebuild-main-raw-log
          path: xcodebuild-main-raw.log
          retention-days: 1

      - name: Build Test Target
        uses: ./.github/actions/xcodebuild
        with:
          actions: build-for-testing
          scheme: ${{ steps.settings.outputs.scheme }}
          filetype-parameter: ${{ steps.settings.outputs.filetype_parameter }}
          file-to-build: ${{ steps.settings.outputs.file_to_build }}
          extra-args: -derivedDataPath DerivedData -enableCodeCoverage YES
          raw-log-path: xcodebuild-test-raw.log

      - name: Upload Raw Test Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcodebuild-test-raw-log
          path: xcodebuild-test-raw.log
          retention-days: 1

      - name: Archive Test Build Products
        run: tar -cf test-build-products.tar -C DerivedData/Build Products

      - name: Upload Test Build Products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-build-products
          path: test-build-products.tar
          retention-days: 1


  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device:
          - *iphone-device
          - *ipad-device
    env:
      UNIT_TEST_TARGET: "LummiTests"
      TEST_OS: "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Test Build Products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-build-products

      - name: Extract Test Build Products
        run: |
          mkdir -p DerivedData/Build
          tar -xf test-build-products.tar -C DerivedData/Build

      - name: Run Unit Tests
        uses: ./.github/actions/run-tests
        with:
          device: ${{ matrix.device }}
          os: ${{ env.TEST_OS }}
          test-filter: -only-testing:${{ env.UNIT_TEST_TARGET }}
          result-bundle-path: TestResults.xcresult

      - name: Upload Coverage
        if: always() && matrix.device == env.COVERAGE_DEVICE
        uses: ./.github/actions/upload-coverage
        with:
          xcresult-path: TestResults.xcresult
          coverage-file: coverage.xml
          flags: unittests
          codecov-token: ${{ secrets.CODECOV_TOKEN }}


  ui-tests:
    name: UI Tests
    needs: build
    runs-on: macos-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        device:
          - *iphone-device
    env:
      UI_TEST_TARGET: "LummiUITests"
      TEST_OS: "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Test Build Products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-build-products

      - name: Extract Test Build Products
        run: |
          mkdir -p DerivedData/Build
          tar -xf test-build-products.tar -C DerivedData/Build

      - name: Run UI Tests
        uses: ./.github/actions/run-tests
        with:
          device: ${{ matrix.device }}
          os: ${{ env.TEST_OS }}
          test-filter: -only-testing:${{ env.UI_TEST_TARGET }}
          result-bundle-path: UITestResults.xcresult

      - name: Upload Coverage
        if: always()
        uses: ./.github/actions/upload-coverage
        with:
          xcresult-path: UITestResults.xcresult
          coverage-file: ui-coverage.xml
          flags: uitests
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
