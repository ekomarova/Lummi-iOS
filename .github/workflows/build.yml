name: Xcode
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.github/workflows/build.yml'
      - '.github/actions/determine-build-settings/**'
      - '.github/actions/xcodebuild/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Determine Build Settings
        id: settings
        uses: ./.github/actions/determine-build-settings

      - name: Build Main Target
        uses: ./.github/actions/xcodebuild
        with:
          actions: clean build analyze
          scheme: ${{ steps.settings.outputs.scheme }}
          filetype-parameter: ${{ steps.settings.outputs.filetype_parameter }}
          file-to-build: ${{ steps.settings.outputs.file_to_build }}
          raw-log-path: xcodebuild-main-raw.log

      - name: Upload Raw Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcodebuild-main-raw-log
          path: xcodebuild-main-raw.log
          retention-days: 1

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:swift"
          upload: never
          output: codeql-sarif

      - name: Upload CodeQL Analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-sarif
          path: codeql-sarif
          retention-days: 1

      - name: Build Test Target
        uses: ./.github/actions/xcodebuild
        with:
          actions: build-for-testing
          scheme: ${{ steps.settings.outputs.scheme }}
          filetype-parameter: ${{ steps.settings.outputs.filetype_parameter }}
          file-to-build: ${{ steps.settings.outputs.file_to_build }}
          extra-args: -derivedDataPath DerivedData
          raw-log-path: xcodebuild-test-raw.log

      - name: Upload Raw Test Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcodebuild-test-raw-log
          path: xcodebuild-test-raw.log
          retention-days: 1

      - name: Archive Test Build Products
        run: tar -cf test-build-products.tar -C DerivedData/Build Products

      - name: Upload Test Build Products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-build-products
          path: test-build-products.tar
          retention-days: 1


  codeql:
    name: CodeQL
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Download CodeQL SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codeql-sarif
          path: codeql-sarif

      - name: Upload CodeQL Results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: codeql-sarif
          category: "/language:swift"

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - "iPhone 17"
          - "iPad Pro 13-inch (M5)"
    env:
      UI_TEST_TARGET: "LummiUITests"
      TEST_OS: "latest"
    steps:
      - name: Download Test Build Products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-build-products

      - name: Extract Test Build Products
        run: |
          mkdir -p DerivedData/Build
          tar -xf test-build-products.tar -C DerivedData/Build

      - name: Locate xctestrun file
        id: xctestrun
        run: |
          file=$(find DerivedData/Build/Products -maxdepth 1 -name "*.xctestrun" | head -n 1)
          if [ -z "$file" ]; then
            echo "xctestrun file not found in DerivedData/Build/Products" >&2
            exit 1
          fi
          echo "Found: $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -xctestrun "${{ steps.xctestrun.outputs.path }}" \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ env.TEST_OS }}' \
            -skip-testing:"${{ env.UI_TEST_TARGET }}" \
            -resultBundlePath TestResults.xcresult \
            | xcpretty && exit ${PIPESTATUS[0]}
 
      - name: Print Test Summary
        if: always()
        run: |
          if [ ! -d "TestResults.xcresult" ]; then
            echo "TestResults.xcresult not found - tests likely did not run." >&2
            exit 1
          fi
 
          summary=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult)
          total=$(echo "$summary" | jq '.totalTestCount')
          passed=$(echo "$summary" | jq '.passedTests')
          failed=$(echo "$summary" | jq '.failedTests')
          skipped=$(echo "$summary" | jq '.skippedTests')
 
          echo "${{ matrix.device }}: total $total, passed $passed, failed $failed, skipped $skipped"

