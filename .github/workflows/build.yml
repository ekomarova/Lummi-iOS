name: Xcode
on:
  pull_request:
    branches: [ "master" ]
    paths:
      - '**/*.swift'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Determine Build Settings
        id: settings
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "Using default scheme: $default"

          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$`"
          else
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$`"
          fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`

          echo "scheme=$default" >> "$GITHUB_OUTPUT"
          echo "filetype_parameter=$filetype_parameter" >> "$GITHUB_OUTPUT"
          echo "file_to_build=$file_to_build" >> "$GITHUB_OUTPUT"

      - name: Build Main Target
        run: |
          xcodebuild clean build analyze \
            -scheme "${{ steps.settings.outputs.scheme }}" \
            -"${{ steps.settings.outputs.filetype_parameter }}" "${{ steps.settings.outputs.file_to_build }}" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Build Test Target
        run: |
          xcodebuild build-for-testing \
            -scheme "${{ steps.settings.outputs.scheme }}" \
            -"${{ steps.settings.outputs.filetype_parameter }}" "${{ steps.settings.outputs.file_to_build }}" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Archive Test Build Products
        run: tar -cf test-build-products.tar -C DerivedData/Build Products

      - name: Upload Test Build Products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-build-products
          path: test-build-products.tar
          retention-days: 1


  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        device:
          - "iPhone 17"
          - "iPad Pro 13-inch (M5)"
    env:
      UI_TEST_TARGET: "LummiUITests"
      TEST_OS: "latest"
    steps:
      - name: Download Test Build Products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-build-products

      - name: Extract Test Build Products
        run: |
          mkdir -p DerivedData/Build
          tar -xf test-build-products.tar -C DerivedData/Build

      - name: Locate xctestrun file
        id: xctestrun
        run: |
          file=$(find DerivedData/Build/Products -maxdepth 1 -name "*.xctestrun" | head -n 1)
          if [ -z "$file" ]; then
            echo "xctestrun file not found in DerivedData/Build/Products" >&2
            exit 1
          fi
          echo "Found: $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -xctestrun "${{ steps.xctestrun.outputs.path }}" \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ env.TEST_OS }}' \
            -skip-testing:"${{ env.UI_TEST_TARGET }}" \
            -resultBundlePath TestResults.xcresult \
            | xcpretty && exit ${PIPESTATUS[0]}
 
      - name: Print Test Summary
        if: always()
        run: |
          if [ ! -d "TestResults.xcresult" ]; then
            echo "TestResults.xcresult not found - tests likely did not run." >&2
            exit 1
          fi
 
          summary=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult)
          total=$(echo "$summary" | jq '.totalTestCount')
          passed=$(echo "$summary" | jq '.passedTests')
          failed=$(echo "$summary" | jq '.failedTests')
          skipped=$(echo "$summary" | jq '.skippedTests')
 
          echo "${{ matrix.device }}: total $total, passed $passed, failed $failed, skipped $skipped"

